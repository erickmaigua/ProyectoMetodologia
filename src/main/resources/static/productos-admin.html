<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Admin</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --purple-1: #667eea;
            --purple-2: #764ba2;
            --grad: linear-gradient(135deg, var(--purple-1), var(--purple-2));
            --radius: 18px;
            --shadow: 0 6px 24px rgba(0,0,0,.10);
            --shadow-lg: 0 20px 50px rgba(0,0,0,.18);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--grad);
            min-height: 100vh;
            padding: 24px;
        }
        .page { max-width: 1400px; margin: 0 auto; }

        /* ─── HEADER ─── */
        .top-bar {
            background: #fff;
            padding: 20px 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 { font-size: 26px; font-weight: 700; color: #1a1a1a; }
        .top-bar-actions { display: flex; gap: 12px; }

        /* ─── BOTONES ─── */
        .btn {
            padding: 11px 22px;
            border: none; border-radius: 12px;
            font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all .22s;
            letter-spacing: .4px;
        }
        .btn-primary { background: var(--grad); color: #fff; }
        .btn-primary:hover { opacity:.88; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(102,126,234,.45); }
        .btn-secondary { background: #f0f1f5; color: #555; }
        .btn-secondary:hover { background: #e4e6ed; }
        .btn-danger { background: #fff0f0; color: #c62828; border: 1px solid #ffcdd2; }
        .btn-danger:hover { background: #ffcdd2; }
        .btn-ghost { background: transparent; color: var(--purple-1); border: 2px solid var(--purple-1); }
        .btn-ghost:hover { background: #f0f1ff; }
        .btn-sm { padding: 8px 14px; font-size: 12px; }

        /* ─── STATS ─── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            padding: 22px 18px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: transform .22s, box-shadow .22s;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 14px 36px rgba(0,0,0,.13); }
        .stat-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; }
        .sc-total::after  { background: var(--grad); }
        .sc-nino::after   { background: linear-gradient(90deg,#388e3c,#a5d6a7); }
        .sc-adol::after   { background: linear-gradient(90deg,#f57c00,#ffcc80); }
        .sc-adulto::after { background: linear-gradient(90deg,#1565c0,#90caf9); }
        .stat-num {
            font-size: 42px; font-weight: 800;
            background: var(--grad);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .stat-lbl { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; font-weight: 700; margin-top: 6px; }

        /* ─── ZONA PRINCIPAL: 2 columnas ─── */
        .workspace {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }

        /* ─── PANEL FORMULARIO ─── */
        .form-panel {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: sticky;
            top: 24px;
        }
        .form-panel-header {
            background: var(--grad);
            padding: 22px 26px;
            color: #fff;
            position: relative;
        }
        .form-panel-header h2 { font-size: 18px; font-weight: 700; }
        .form-panel-header p  { font-size: 12px; opacity: .8; margin-top: 4px; }
        .clear-btn {
            position: absolute; top: 14px; right: 16px;
            background: rgba(255,255,255,.2); border: none;
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            font-size: 16px; cursor: pointer; transition: all .2s;
            display: flex; align-items: center; justify-content: center;
        }
        .clear-btn:hover { background: rgba(255,255,255,.35); transform: rotate(90deg); }

        .form-body { padding: 22px 24px; }

        .fgroup { margin-bottom: 16px; }
        .fgroup label {
            display: block; margin-bottom: 7px;
            font-size: 12px; font-weight: 700; color: #444;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .fgroup label .req { color: #ef4444; }
        .fgroup input[type=text],
        .fgroup input[type=number],
        .fgroup select,
        .fgroup textarea {
            width: 100%;
            padding: 10px 13px;
            border: 2px solid #e8e8e8;
            border-radius: 11px;
            font-size: 14px; font-family: inherit;
            outline: none; transition: all .2s;
            background: #fafafa;
        }
        .fgroup input:focus, .fgroup select:focus, .fgroup textarea:focus {
            border-color: var(--purple-1);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102,126,234,.10);
        }
        .fgroup textarea { resize: vertical; min-height: 72px; }

        .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Selector categoría edad */
        .edad-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 2px; }
        .edad-opt {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 12px 6px;
            border: 2px solid #e8e8e8; border-radius: 12px;
            cursor: pointer; transition: all .2s; text-align: center;
            background: #fafafa;
        }
        .edad-opt:hover { border-color: var(--purple-1); background: #f8f9ff; }
        .edad-opt.sel   { border-color: var(--purple-1); background: #f0f1ff; }
        .edad-opt input[type=radio] { display: none; }
        .edad-opt .eo-icon  { font-size: 24px; }
        .edad-opt .eo-name  { font-size: 11px; font-weight: 700; color: #374151; }
        .edad-opt .eo-range { font-size: 10px; color: #9ca3af; margin-top: 1px; }
        .edad-opt.sel .eo-name { color: var(--purple-1); }

        /* Preview imagen */
        .img-preview {
            width: 100%; height: 150px;
            border: 2px dashed #ddd; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; color: #ccc; background: #fafafa;
            margin-bottom: 10px; overflow: hidden;
            transition: border-color .2s;
        }
        .img-preview img { width: 100%; height: 100%; object-fit: cover; }
        .img-preview:hover { border-color: var(--purple-1); }
        .file-btn {
            display: flex; align-items: center; justify-content: center; gap: 7px;
            width: 100%; padding: 9px;
            background: #f0f1f5; border: 1px solid #e0e0e0;
            border-radius: 10px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all .2s; color: #555;
        }
        .file-btn:hover { background: #e4e6ed; border-color: var(--purple-1); color: var(--purple-1); }
        .img-note { font-size: 11px; color: #9ca3af; margin-top: 6px; }

        .form-actions { padding: 0 24px 22px; display: flex; gap: 10px; }
        .form-actions .btn { flex: 1; padding: 12px; }

        /* ─── PANEL DERECHO: lista ─── */
        .list-panel { display: flex; flex-direction: column; gap: 18px; }

        .filters-bar {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 22px;
            box-shadow: var(--shadow);
            display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
        }
        .fb-group { flex: 1; min-width: 160px; }
        .fb-group label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; }
        .fb-group select, .fb-group input { width: 100%; padding: 9px 13px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 13px; outline: none; transition: all .2s; background: #fafafa; }
        .fb-group select:focus, .fb-group input:focus { border-color: var(--purple-1); background: #fff; }

        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px;
        }
        .prod-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all .25s;
        }
        .prod-card:hover { transform: translateY(-5px); box-shadow: 0 16px 42px rgba(0,0,0,.12); }
        .prod-img {
            width: 100%; height: 180px;
            background: #f8f9fa;
            display: flex; align-items: center; justify-content: center;
            font-size: 52px; position: relative; overflow: hidden;
        }
        .prod-img img { width: 100%; height: 100%; object-fit: cover; }
        .edad-tag {
            position: absolute; top: 10px; right: 10px;
            padding: 4px 11px; border-radius: 20px;
            font-size: 10px; font-weight: 800;
            backdrop-filter: blur(8px);
        }
        .et-NINO        { background: rgba(56,142,60,.88); color: #fff; }
        .et-ADOLESCENTE { background: rgba(245,124,0,.88); color: #fff; }
        .et-ADULTO      { background: rgba(21,101,192,.88); color: #fff; }
        .prod-info { padding: 16px; }
        .prod-name  { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prod-meta  { color: #999; font-size: 12px; margin-bottom: 8px; }
        .prod-price { font-size: 20px; font-weight: 800; color: var(--purple-1); margin-bottom: 7px; }
        .stock-pill { display: inline-block; padding: 4px 10px; border-radius: 9px; font-size: 11px; font-weight: 700; }
        .sp-ok  { background: #e8f5e9; color: #2e7d32; }
        .sp-mid { background: #fff3e0; color: #e65100; }
        .sp-low { background: #ffebee; color: #c62828; }
        .prod-actions { display: flex; gap: 7px; margin-top: 12px; }
        .prod-actions .btn { flex: 1; }

        /* empty */
        .empty-state {
            background: #fff; border-radius: var(--radius);
            padding: 60px 32px; text-align: center;
            box-shadow: var(--shadow); grid-column: 1/-1;
        }
        .empty-state .ei { font-size: 64px; opacity: .3; margin-bottom: 16px; }
        .empty-state h3  { color: #666; font-size: 18px; margin-bottom: 8px; }
        .empty-state p   { color: #aaa; font-size: 14px; }

        /* ─── TOAST ─── */
        @keyframes tin  { from{transform:translateX(110%);opacity:0} to{transform:translateX(0);opacity:1} }
        @keyframes tout { from{opacity:1} to{opacity:0;transform:translateY(-8px)} }
        .toast {
            position: fixed; top: 22px; right: 22px;
            padding: 14px 20px; border-radius: 13px;
            font-weight: 600; font-size: 13px;
            box-shadow: 0 8px 26px rgba(0,0,0,.2);
            z-index: 9999; display: flex; align-items: center; gap: 9px;
            animation: tin .32s cubic-bezier(.34,1.56,.64,1);
        }
        .toast.ok  { background: #1b5e20; color: #fff; }
        .toast.err { background: #b71c1c; color: #fff; }
    </style>
</head>
<body>
<div class="page">

    <!-- TOP BAR -->
    <div class="top-bar">
        <h1>👟 Gestión de Productos</h1>
        <div class="top-bar-actions">
            <button class="btn btn-secondary" onclick="location.href='admin.html'">← Panel Admin</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
        <div class="stat-card sc-total">
            <div class="stat-num" id="sTotal">0</div>
            <div class="stat-lbl">Total</div>
        </div>
        <div class="stat-card sc-nino">
            <div class="stat-num" id="sNino">0</div>
            <div class="stat-lbl">👶 Niños</div>
        </div>
        <div class="stat-card sc-adol">
            <div class="stat-num" id="sAdol">0</div>
            <div class="stat-lbl">🧑 Adolescentes</div>
        </div>
        <div class="stat-card sc-adulto">
            <div class="stat-num" id="sAdulto">0</div>
            <div class="stat-lbl">👨 Adultos</div>
        </div>
    </div>

    <!-- WORKSPACE: FORM + LISTA -->
    <div class="workspace">

        <!-- ─── PANEL FORMULARIO ─── -->
        <div class="form-panel">
            <div class="form-panel-header">
                <button class="clear-btn" onclick="resetForm()" title="Nuevo producto">×</button>
                <h2 id="fpTitle">➕ Agregar Producto</h2>
                <p id="fpSubtitle">Completa los datos y guarda</p>
            </div>

            <div class="form-body">
                <form id="fpForm" onsubmit="guardarProducto(event)">
                    <input type="hidden" id="fpId">
                    <input type="hidden" id="fpImgUrl">
                    <input type="hidden" id="fpImgOrig">

                    <!-- IMAGEN -->
                    <div class="fgroup">
                        <label>Imagen</label>
                        <div class="img-preview" id="fpImgPreview">👟</div>
                        <input type="file" id="fpImgFile" accept="image/*" style="display:none" onchange="previewImg(event)">
                        <label for="fpImgFile" class="file-btn">📷 Seleccionar imagen</label>
                        <p class="img-note" id="fpImgNote" style="display:none">✅ Imagen actual conservada si no cambias</p>
                    </div>

                    <!-- NOMBRE + MARCA -->
                    <div class="frow">
                        <div class="fgroup">
                            <label>Nombre <span class="req">*</span></label>
                            <input type="text" id="fpNombre" required placeholder="Ej: Air Max">
                        </div>
                        <div class="fgroup">
                            <label>Marca <span class="req">*</span></label>
                            <input type="text" id="fpMarca" required placeholder="Ej: Nike">
                        </div>
                    </div>

                    <!-- DESCRIPCIÓN -->
                    <div class="fgroup">
                        <label>Descripción</label>
                        <textarea id="fpDescripcion" placeholder="Descripción del producto..."></textarea>
                    </div>

                    <!-- CATEGORÍA EDAD — selector visual -->
                    <div class="fgroup">
                        <label>Categoría de Edad <span class="req">*</span></label>
                        <div class="edad-selector">
                            <label class="edad-opt" id="eoNino">
                                <input type="radio" name="fpEdad" value="NINO" onchange="selectEdad('NINO')">
                                <span class="eo-icon">👶</span>
                                <span class="eo-name">Niños</span>
                                <span class="eo-range">0–12 años</span>
                            </label>
                            <label class="edad-opt" id="eoAdol">
                                <input type="radio" name="fpEdad" value="ADOLESCENTE" onchange="selectEdad('ADOLESCENTE')">
                                <span class="eo-icon">🧑</span>
                                <span class="eo-name">Adolescentes</span>
                                <span class="eo-range">13–17 años</span>
                            </label>
                            <label class="edad-opt" id="eoAdulto">
                                <input type="radio" name="fpEdad" value="ADULTO" onchange="selectEdad('ADULTO')">
                                <span class="eo-icon">👨</span>
                                <span class="eo-name">Adultos</span>
                                <span class="eo-range">18+ años</span>
                            </label>
                        </div>
                        <input type="hidden" id="fpEdadVal">
                    </div>

                    <!-- CATEGORÍA + COLOR -->
                    <div class="frow">
                        <div class="fgroup">
                            <label>Categoría <span class="req">*</span></label>
                            <select id="fpCategoria" required>
                                <option value="">Seleccionar...</option>
                                <option>Deportivo</option>
                                <option>Formal</option>
                                <option>Casual</option>
                                <option>Escolar</option>
                                <option>Urbano</option>
                                <option>Sandalia</option>
                                <option>Bota</option>
                            </select>
                        </div>
                        <div class="fgroup">
                            <label>Color</label>
                            <input type="text" id="fpColor" placeholder="Ej: Negro">
                        </div>
                    </div>

                    <!-- PRECIO + STOCK -->
                    <div class="frow">
                        <div class="fgroup">
                            <label>Precio ($) <span class="req">*</span></label>
                            <input type="number" id="fpPrecio" step="0.01" min="0" required placeholder="0.00">
                        </div>
                        <div class="fgroup">
                            <label>Stock <span class="req">*</span></label>
                            <input type="number" id="fpStock" min="0" required placeholder="0">
                        </div>
                    </div>

                </form>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Limpiar</button>
                <button type="submit" form="fpForm" class="btn btn-primary" id="fpSubmitBtn">💾 Guardar Producto</button>
            </div>
        </div>

        <!-- ─── PANEL DERECHO ─── -->
        <div class="list-panel">

            <!-- Filtros -->
            <div class="filters-bar">
                <div class="fb-group">
                    <label>Edad</label>
                    <select id="fEdad" onchange="filtrar()">
                        <option value="">Todas las edades</option>
                        <option value="NINO">👶 Niños</option>
                        <option value="ADOLESCENTE">🧑 Adolescentes</option>
                        <option value="ADULTO">👨 Adultos</option>
                    </select>
                </div>
                <div class="fb-group">
                    <label>Categoría</label>
                    <select id="fCat" onchange="filtrar()">
                        <option value="">Todas</option>
                        <option>Deportivo</option>
                        <option>Formal</option>
                        <option>Casual</option>
                        <option>Escolar</option>
                        <option>Urbano</option>
                        <option>Sandalia</option>
                        <option>Bota</option>
                    </select>
                </div>
                <div class="fb-group">
                    <label>Buscar</label>
                    <input type="text" id="fBuscar" placeholder="Nombre o marca..." oninput="filtrar()">
                </div>
            </div>

            <!-- Grid productos -->
            <div id="prodGrid" class="productos-grid">
                <div class="empty-state">
                    <div class="ei">📦</div>
                    <h3>Sin productos aún</h3>
                    <p>Usa el formulario de la izquierda para agregar el primer producto.</p>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
const API = 'http://localhost:8080/api';
let productos = [];
let edadSel   = '';
let newImgB64 = null;
const edadMap = { NINO:'eoNino', ADOLESCENTE:'eoAdol', ADULTO:'eoAdulto' };

// ── Cargar lista inicial (sin render automático al arrancar) ──
async function cargarLista() {
    try {
        const r = await fetch(`${API}/productos`);
        productos = await r.json();
        actualizarStats();
        renderGrid(productos);
    } catch(e) {
        console.error(e);
    }
}

// ── Estadísticas ──
function actualizarStats() {
    animN('sTotal',  productos.length);
    animN('sNino',   productos.filter(p => p.categoriaEdad === 'NINO').length);
    animN('sAdol',   productos.filter(p => p.categoriaEdad === 'ADOLESCENTE').length);
    animN('sAdulto', productos.filter(p => p.categoriaEdad === 'ADULTO').length);
}
function animN(id, t) {
    const el = document.getElementById(id);
    const s = parseInt(el.textContent)||0, steps=16, inc=(t-s)/steps;
    let c=s,n=0;
    const ti=setInterval(()=>{ n++;c+=inc; el.textContent=n>=steps?t:Math.round(c); if(n>=steps)clearInterval(ti); },30);
}

// ── Render grid ──
function renderGrid(lista) {
    const g = document.getElementById('prodGrid');
    if (!lista.length) {
        g.innerHTML = `<div class="empty-state">
            <div class="ei">🔍</div>
            <h3>Sin resultados</h3>
            <p>No hay productos con esos filtros, o todavía no has añadido ninguno.</p>
        </div>`;
        return;
    }
    g.innerHTML = lista.map(p => `
        <div class="prod-card">
            <div class="prod-img">
                ${p.imagen && p.imagen !== '/images/default.jpg'
                    ? `<img src="${p.imagen}" alt="${p.nombre}" onerror="this.parentElement.innerHTML='👟'">`
                    : '👟'}
                ${p.categoriaEdad
                    ? `<span class="edad-tag et-${p.categoriaEdad}">${etLabel(p.categoriaEdad)}</span>`
                    : ''}
            </div>
            <div class="prod-info">
                <div class="prod-name" title="${p.nombre}">${p.nombre}</div>
                <div class="prod-meta">${p.marca||'Sin marca'}${p.color?' · '+p.color:''} · ${p.categoria||'—'}</div>
                <div class="prod-price">$${(p.precio||0).toFixed(2)}</div>
                <span class="stock-pill ${spCls(p.stock||0)}">Stock: ${p.stock||0}</span>
                <div class="prod-actions">
                    <button class="btn btn-ghost btn-sm" onclick="cargarEnForm('${p.id}')">✏️ Editar</button>
                    <button class="btn btn-danger btn-sm" onclick="eliminar('${p.id}','${esc(p.nombre)}')">🗑️</button>
                </div>
            </div>
        </div>
    `).join('');
}

function etLabel(e) { return {NINO:'👶 Niños',ADOLESCENTE:'🧑 Adol.',ADULTO:'👨 Adulto'}[e]||e; }
function spCls(s)   { return s>=20?'sp-ok':s>=10?'sp-mid':'sp-low'; }
function esc(s)     { return (s||'').replace(/'/g,"\\'"); }

// ── Filtros ──
function filtrar() {
    const edad = document.getElementById('fEdad').value;
    const cat  = document.getElementById('fCat').value;
    const bus  = document.getElementById('fBuscar').value.toLowerCase();
    let f = productos;
    if (edad) f = f.filter(p => p.categoriaEdad === edad);
    if (cat)  f = f.filter(p => p.categoria === cat);
    if (bus)  f = f.filter(p => (p.nombre||'').toLowerCase().includes(bus)||(p.marca||'').toLowerCase().includes(bus));
    renderGrid(f);
}

// ── Selector edad ──
function selectEdad(val) {
    edadSel = val;
    document.getElementById('fpEdadVal').value = val;
    // Actualizar estilo visual de los labels
    Object.values(edadMap).forEach(function(labelId) {
        document.getElementById(labelId).classList.remove('sel');
    });
    document.getElementById(edadMap[val]).classList.add('sel');
}

// ── Preview imagen ──
function previewImg(e) {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
        newImgB64 = ev.target.result;
        document.getElementById('fpImgUrl').value   = ev.target.result;
        document.getElementById('fpImgPreview').innerHTML = `<img src="${ev.target.result}" alt="Preview">`;
        document.getElementById('fpImgNote').style.display = 'block';
        document.getElementById('fpImgNote').textContent   = '✅ Nueva imagen seleccionada';
    };
    r.readAsDataURL(file);
}

// ── Cargar producto en formulario para editar ──
function cargarEnForm(id) {
    const p = productos.find(x => x.id === id);
    if (!p) return;
    newImgB64 = null;
    edadSel   = p.categoriaEdad || '';

    document.getElementById('fpTitle').textContent    = '✏️ Editar Producto';
    document.getElementById('fpSubtitle').textContent = `Editando: ${p.nombre}`;
    document.getElementById('fpSubmitBtn').textContent= '💾 Actualizar Producto';
    document.getElementById('fpId').value       = p.id;
    document.getElementById('fpNombre').value   = p.nombre || '';
    document.getElementById('fpDescripcion').value = p.descripcion || '';
    document.getElementById('fpMarca').value    = p.marca || '';
    document.getElementById('fpColor').value    = p.color || '';
    document.getElementById('fpCategoria').value= p.categoria || '';
    document.getElementById('fpPrecio').value   = p.precio || '';
    document.getElementById('fpStock').value    = p.stock || 0;
    document.getElementById('fpImgUrl').value   = p.imagen || '';
    document.getElementById('fpImgOrig').value  = p.imagen || '';
    document.getElementById('fpEdadVal').value  = p.categoriaEdad || '';

    // Selector visual edad — limpiar todo, luego marcar el correcto
    Object.values(edadMap).forEach(function(labelId) {
        var labelEl = document.getElementById(labelId);
        labelEl.classList.remove('sel');
        var radio = labelEl.querySelector('input[type="radio"]');
        if (radio) radio.checked = false;
    });
    if (p.categoriaEdad && edadMap[p.categoriaEdad]) {
        document.getElementById(edadMap[p.categoriaEdad]).classList.add('sel');
        var radioSel = document.querySelector('input[name="fpEdad"][value="' + p.categoriaEdad + '"]');
        if (radioSel) radioSel.checked = true;
    }

    // Preview imagen
    const prev = document.getElementById('fpImgPreview');
    if (p.imagen && p.imagen !== '/images/default.jpg') {
        prev.innerHTML = `<img src="${p.imagen}" alt="${p.nombre}" onerror="this.parentElement.innerHTML='👟'">`;
        document.getElementById('fpImgNote').style.display  = 'block';
        document.getElementById('fpImgNote').textContent    = '📷 Imagen actual — se conserva si no cambias';
    } else {
        prev.innerHTML = '👟';
    }

    // Scroll hasta el form en móvil
    document.querySelector('.form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Guardar (crear o actualizar) ──
async function guardarProducto(e) {
    e.preventDefault();

    if (!document.getElementById('fpEdadVal').value) {
        toast('⚠️ Selecciona una categoría de edad', 'err'); return;
    }

    const id = document.getElementById('fpId').value;

    // FIX imagen: nueva > original de BD > default
    const imgFinal = newImgB64
        || document.getElementById('fpImgOrig').value
        || '/images/default.jpg';

    const body = {
        nombre:       document.getElementById('fpNombre').value,
        descripcion:  document.getElementById('fpDescripcion').value,
        marca:        document.getElementById('fpMarca').value,
        color:        document.getElementById('fpColor').value,
        categoriaEdad:document.getElementById('fpEdadVal').value,
        categoria:    document.getElementById('fpCategoria').value,
        precio:       parseFloat(document.getElementById('fpPrecio').value),
        stock:        parseInt(document.getElementById('fpStock').value),
        imagen:       imgFinal
    };

    try {
        let res;
        if (id) {
            body.id = id;
            res = await fetch(`${API}/productos/${id}`, {
                method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
            });
        } else {
            res = await fetch(`${API}/productos`, {
                method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
            });
        }
        if (res.ok) {
            toast(id ? '✅ Producto actualizado' : '✅ Producto creado', 'ok');
            resetForm();
            await cargarLista();
        } else {
            toast('❌ Error al guardar', 'err');
        }
    } catch(ex) {
        console.error(ex);
        toast('❌ Error de conexión', 'err');
    }
}

// ── Eliminar ──
async function eliminar(id, nombre) {
    if (!confirm(`¿Eliminar "${nombre}"? No se puede deshacer.`)) return;
    try {
        const res = await fetch(`${API}/productos/${id}`, { method:'DELETE' });
        if (res.ok) {
            toast('🗑️ Producto eliminado', 'ok');
            await cargarLista();
        } else { toast('❌ Error al eliminar', 'err'); }
    } catch(ex) { toast('❌ Error de conexión', 'err'); }
}

// ── Reset form ──
function resetForm() {
    newImgB64 = null; edadSel = '';
    document.getElementById('fpForm').reset();
    document.getElementById('fpId').value     = '';
    document.getElementById('fpImgUrl').value = '';
    document.getElementById('fpImgOrig').value= '';
    document.getElementById('fpEdadVal').value= '';
    document.getElementById('fpImgPreview').innerHTML = '👟';
    document.getElementById('fpImgNote').style.display = 'none';
    document.getElementById('fpTitle').textContent     = '➕ Agregar Producto';
    document.getElementById('fpSubtitle').textContent  = 'Completa los datos y guarda';
    document.getElementById('fpSubmitBtn').textContent = '💾 Guardar Producto';
    Object.values(edadMap).forEach(function(labelId) {
        document.getElementById(labelId).classList.remove('sel');
    });
    document.querySelectorAll('input[name="fpEdad"]').forEach(function(r) { r.checked = false; });
    document.getElementById('fpImgFile').value = '';
}

// ── Toast ──
function toast(msg, tipo='ok') {
    const t = document.createElement('div');
    t.className = `toast ${tipo}`; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.animation='tout .3s forwards'; setTimeout(()=>t.remove(),300); }, 2800);
}

// Cargar al iniciar
cargarLista();
</script>
