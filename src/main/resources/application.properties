# Configuración de la aplicación
spring.application.name=zapateria-tienda

# MongoDB Atlas - Usar variable de entorno para seguridad
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/zapateria_db}

# Puerto del servidor
server.port=8080

# Recursos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Configuración del administrador (usar variables de entorno en producción)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.email=${ADMIN_EMAIL:admin@zapateria.com}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.apellido=${ADMIN_APELLIDO:Sistema}
app.admin.telefono=${ADMIN_TELEFONO:0999999999}

# Logging
logging.level.root=INFO
logging.level.com.zapateria=DEBUG
