name: Java CI — Maven + JaCoCo

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────
  # Job principal: compilar, testear y cobertura
  # ─────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Compilar
        run: mvn clean compile -q

      - name: 🧪 Ejecutar tests + generar reporte JaCoCo
        run: mvn test

      - name: ✅ Verificar cobertura mínima (50%)
        run: mvn jacoco:check

      - name: 📊 Subir reporte JaCoCo (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: target/site/jacoco/
          retention-days: 30

      - name: 📋 Subir resultados Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: 💬 Comentar cobertura en PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.0
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 50
          title: "📊 Reporte de Cobertura — JaCoCo"
          update-comment: true

      - name: 📦 Empaquetar JAR (skip tests)
        if: success()
        run: mvn package -DskipTests -q

      - name: 📤 Subir JAR como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zapateria-app
          path: target/*.jar
          retention-days: 30

  # ─────────────────────────────────────────────
  # Resumen de tests visible en el PR
  # ─────────────────────────────────────────────
  test-summary:
    name: 📋 Resumen de Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: 📥 Descargar resultados Surefire
        uses: actions/download-artifact@v4
        with:
          name: surefire-reports
          path: surefire-reports/

      - name: 📊 Publicar resumen de tests en PR
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: surefire-reports/**/*.xml
          check_name: "Resultados de Tests Unitarios"
          comment_title: "🧪 Tests Unitarios — Zapatería"
          fail_on: "test failures"
